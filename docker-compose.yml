version: "3.9"
services:
  backend:
    build: ./backend
    container_name: congestion_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: congestion_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend